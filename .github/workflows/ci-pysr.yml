name: ci-pysr

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  pysr:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PySR extra (Julia may be unavailable)
        run: |
          pip install -e ".[dev,pysr]" || echo "pysr extra unavailable"
          pytest -m pysr || echo "PySR lane retired or Julia missing (RFC-001 D9.5)"
