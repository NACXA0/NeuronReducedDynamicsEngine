name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Test (core lane)
        run: pytest --cov=fre --cov-report=term-missing --cov-fail-under=70 -m "not pysr and not flygym"
