# A-layer preset: flygym-demo-v01 (RFC-002 §3.2 / protocol 3)
preset: flygym-demo-v01
n_nodes: 40
n_actuators: 6
n_sense: 8
edge_p: 0.05
edge_weight: 0.001
seed: 0
steps: 100
mode: rate
fly_name: fly
actuator_type: joints
type_names: [type_0, type_1]
sense_idx: [0, 1, 2, 3, 4, 5, 6, 7]
motor_idx: [8, 9, 10, 11, 12, 13]
# Type-keyed seeds (legacy model keys still resolve with DeprecationWarning)
artifacts:
  - path: artifacts/type_0.npz
    type_id: type_0
    model: explif
  - path: artifacts/aCC.npz
    type_id: aCC
    model: adexp
artifact_hashes:
  type_0.npz: 1e94adc956eec92f
  aCC.npz: 7505fa9b8378dc29
io_map:
  inputs:
    - type_id: type_0
      encoder: {kind: linear, gain: 1.0, bias: 0.35}
  outputs:
    - type_id: type_1
      decoder: {kind: lowpass, tau: 0.02, window: 20}
