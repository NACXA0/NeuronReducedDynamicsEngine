[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-reduced-dynamics-engine"
version = "0.1.0"
description = "Connectome-driven neuron engine with type-bound reduced activation functions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NRDE contributors" }]
keywords = ["connectome", "reduced-dynamics", "spiking", "neuron", "drosophila", "flygym"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
jax = ["jax>=0.4.20"]
numba = ["numba>=0.59"]
torch = ["torch>=2.1"]
flygym = ["flygym>=2.1; python_version >= '3.12' and python_version < '3.15'"]
# A2 aggregate extra (D20): currently aliases flygym; extend with preset helpers later
fly = ["flygym>=2.1; python_version >= '3.12' and python_version < '3.15'"]
pysr = ["pysr>=0.18"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
demo-assets = ["imageio>=2.31"]

[project.scripts]
nrde = "nrde.cli:main"

[project.urls]
Homepage = "https://github.com/NACXA0/NeuronReducedDynamicsEngine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nrde = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "flygym: tests that need the optional flygym package or a mock closed loop",
    "slow: longer integration or performance tests",
    "pysr: requires optional Julia/PySR extra (NFR-11)",
    "jax: optional JAX offline Euler backend",
    "torch: optional PyTorch CSR engine (CPU or CUDA/cuSPARSE)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.coverage.run]
source = ["nrde"]
branch = true
omit = ["src/nrde/cli.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
